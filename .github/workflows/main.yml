name: Full Stack Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------
  # 1. BACKEND JOB (.NET & Docker)
  # ----------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./todo-backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Restore, Build, and Test
      run: |
        dotnet restore
        dotnet build --no-restore
        dotnet test --no-build --verbosity normal

    # NEW STEP: Build the Docker image on the runner
    - name: Build Docker Image
      run: docker build -t todo-backend-api .

# ----------------------------------------
  # 2. FRONTEND JOB (React & Docker)
  # ----------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./todo-frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build React app
      run: npm run build

    # Log in securely to Docker Hub
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Build and Push the Frontend Image
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-frontend-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/todo-frontend-app:latest
